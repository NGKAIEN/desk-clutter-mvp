name: Offline MVP checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install demo dependencies only
        run: python -m pip install -r requirements.txt
      - name: Check dependencies
        run: python -m pip check
      - name: Unit tests (no camera)
        run: python -m unittest discover -s tests -q
      - name: Documentation links and Python syntax
        run: python tools/check_project_docs.py
      - name: Default demo
        run: python desk_status_v05.py --demo --headless --output-dir tmp/ci-default
      - name: Local-height demo with direction gates
        run: python desk_status_v05.py --demo --demo-background --headless --pca-ratio 1.5 --min-pca-area-cm2 50 --output-dir tmp/ci-local
      - name: Missing-data demo
        run: python desk_status_v05.py --demo --demo-scene missing --headless --output-dir tmp/ci-missing
      - name: Validate public export
        run: python tools/prepare_release.py --output-dir tmp/ci-release
